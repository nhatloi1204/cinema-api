        createdAt: { type: string, format: 'date-time' }
        updatedAt: { type: string, format: 'date-time' }

    News:
      type: object
      properties:
        _id: { type: string }
        title: { type: string }
        content: { type: string }
        image: { type: string }
        createdAt: { type: string, format: 'date-time' }
        updatedAt: { type: string, format: 'date-time' }

    Event:
      type: object
      properties:
        _id: { type: string }
        title: { type: string }
        description: { type: string }
        image: { type: string }
        startDate: { type: string, format: 'date-time' }
        endDate: { type: string, format: 'date-time' }
        createdAt: { type: string, format: 'date-time' }
        updatedAt: { type: string, format: 'date-time' }

    Showtime:
      type: object
      properties:
        _id: { type: string }
        movieId: { $ref: '#/components/schemas/Movie' }
        roomId: { $ref: '#/components/schemas/Room' }
