# ==================================
#           COMPONENTS (SCHEMAS)
# ==================================
components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: auth_token
      description: Xác thực thông qua Cookie HTTP-only

  parameters:
    Id:
      in: path
      name: id
      schema: { type: string }
      required: true
      description: ID của tài nguyên (Mongoose ObjectId)

  schemas:
    # --- INPUT SCHEMAS ---
    AuthRegisterInput:
      type: object
      required: [email, password, username]
      properties:
        email: { type: string, format: email, example: user@example.com }
        password: { type: string, format: password, example: P@sswOrd123 }
        username: { type: string, example: JohnDoe }
    UserUpdateInput:
      type: object
      properties:
        name: { type: string, example: John Doe }
        phoneNumber: { type: string, example: '0901234567' }
        dob: { type: string, format: date, example: '1990-01-01' }
        gender: { type: string, enum: ['Nam', 'Nữ', 'Khác'], example: 'Nam' }
        avatar: { type: string, example: '/images/avatar.jpg' }
    ShopItemInput:
      type: object
      required: [name, price]
      properties:
        name: { type: string, example: 'Combo Bắp nước Lớn' }
        description: { type: string }
        price: { type: number, format: float, example: 85000 }
        image: { type: string }
    NewsInput:
      type: object
      required: [title, content]
      properties:
        title: { type: string, example: 'Tin nóng phòng vé' }
        content: { type: string }
        image: { type: string }
    EventInput:
      type: object
      required: [title, startDate, endDate]
      properties:
        title: { type: string, example: 'Sự kiện Ra mắt phim mới' }
        description: { type: string }
        image: { type: string }
        startDate: { type: string, format: 'date-time' }
        endDate: { type: string, format: 'date-time' }
    TheaterInput:
      type: object
      required: [name, location]
      properties:
        name: { type: string, example: 'CGV Vincom Center' }
        location: { type: string, example: 'Quận 1, TP.HCM' }
    MovieInput:
      type: object
      required: [title, genre, duration, status]
      properties:
        title: { type: string, example: 'Avatar 2' }
        description: { type: string }
        genre: { type: string }
        duration: { type: number, description: 'Thời lượng (phút)' }
        releaseDate: { type: string, format: 'date' }
        poster: { type: string }
        trailerUrl: { type: string }
        director: { type: string }
        cast: { type: array, items: { type: 'string' } }
        status:
          { type: string, enum: ['now_showing', 'coming_soon', 'special'] }
    RoomCreateInput:
      type: object
      required: [name, theaterId, rows, cols]
      properties:
        name: { type: string, example: 'Phòng 1' }
        theaterId: { type: string, description: 'Mongoose ID của Rạp' }
        rows: { type: number, example: 8 }
        cols: { type: number, example: 12 }
    RoomUpdateInput:
      type: object
      properties:
        name: { type: string, example: 'Phòng VIP 1' }
        rows: { type: number, example: 8 }
        cols: { type: number, example: 12 }
        seatLayout:
          { type: 'array', description: 'Bố cục ghế sau khi chỉnh sửa' }
    ShowtimeInput:
      type: object
      required: [movieId, roomId, theaterId, startTime, basePrice]
      properties:
        movieId: { type: string }
        roomId: { type: string }
        theaterId: { type: string }
        startTime: { type: string, format: 'date-time' }
        basePrice: { type: number }

    # --- OUTPUT SCHEMAS (Giống định nghĩa Mongoose trước đó) ---
    AuthRegisterOutput:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        avatar: { type: string }
        role: { type: string, enum: ['Admin', 'User'] }

    User:
      type: object
      properties:
        _id: { type: string }
        auth0Id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        phoneNumber: { type: string }
        avatar: { type: string }
        dob: { type: string, format: date }
        gender: { type: string, enum: ['Nam', 'Nữ', 'Khác'] }
        role: { type: string, enum: ['Admin', 'User'] }
        createdAt: { type: string, format: 'date-time' }
        updatedAt: { type: string, format: 'date-time' }

    Theater:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        location: { type: string }
        createdAt: { type: string, format: 'date-time' }
        updatedAt: { type: string, format: 'date-time' }

    Seat:
      type: object
      properties:
        code: { type: 'string' }
        type: { type: 'string', enum: ['normal', 'vip'] }

    Room:
      type: object
      properties:
        _id: { type: string }
