# openapi.yaml
openapi: 3.0.0
info:
  title: Cinema Management API
  version: 1.0.0
  description: Tài liệu OpenAPI cho hệ thống Quản lý Rạp Chiếu Phim
servers:
  - url: http://localhost:5000
    description: Local Server

security:
  - CookieAuth: []

# ==================================
#            PATHS (ENDPOINTS)
# ==================================
paths:
  # --- AUTH ROUTES ---
  /auth/register:
    post:
      summary: Đăng ký tài khoản mới
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRegisterInput'
      responses:
        '201':
          {
            description: Đăng ký thành công,
            content:
              {
                application/json:
                  {
                    schema: { $ref: '#/components/schemas/AuthRegisterOutput' },
                  },
              },
          }
        '400': { description: Thiếu thông tin hoặc lỗi Auth0 }
  /auth/login:
    get:
      summary: Chuyển hướng đến Auth0 để đăng nhập (OAuth Flow)
      tags: [Authentication]
      responses:
        '302': { description: Chuyển hướng thành công }
  /auth/callback:
    get:
      summary: Callback xử lý mã Auth0 Code và đặt Cookie
      tags: [Authentication]
      parameters:
        - in: query
          name: code
          schema: { type: string }
          required: true
          description: Mã xác thực từ Auth0
      responses:
        '302': { description: Đăng nhập thành công, chuyển hướng về CLIENT_URL }
        '400': { description: Thiếu mã xác thực }
  /auth/logout:
    get:
      summary: Đăng xuất và xóa Cookie, chuyển hướng đến Auth0 Logout
      tags: [Authentication]
      responses:
        '302': { description: Đăng xuất thành công, chuyển hướng về Auth0 }

  # --- USER ROUTES (yêu cầu verifyUser) ---
  /user/profile:
    get:
      summary: Lấy thông tin hồ sơ người dùng hiện tại
      tags: [User Profile]
      security:
        - CookieAuth: []
      responses:
        '200':
          {
            description: Trả về thông tin user,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties:
                          { user: { $ref: '#/components/schemas/User' } },
                      },
                  },
              },
          }
        '401': { description: Không được ủy quyền }
    put:
      summary: Cập nhật thông tin hồ sơ
      tags: [User Profile]
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateInput'
      responses:
        '200':
